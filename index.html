<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: iPhone の画面下（ホームバー）の余白を env(safe-area-inset-bottom) で取るため -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f5" />
    <!-- ホーム画面に追加した時にアプリとして開く（ブラウザのままだと、iPhone はしばらく開かないとデータを消すため） -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SNS Blocker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>SNS Blocker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
